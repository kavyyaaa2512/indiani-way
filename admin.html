<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Admin - Indiani Way</title>
    <style>
        body { font-family: sans-serif; background: #FDF6F0; padding: 20px 5%; }
        .card { background: #fff; padding: 20px; border: 1px solid #ddd; margin-bottom: 20px; border-radius: 6px; }
        input, textarea, select { width: 100%; padding: 10px; margin: 6px 0; border: 1px solid #ccc; border-radius: 4px; }
        .grid { grid-template-columns: 1fr 1fr; display: grid; gap: 10px; }
        .checkbox-row { display: flex; align-items: center; gap: 8px; margin: 10px 0; }
        .checkbox-row input { width: auto; margin: 0; }
        .btn { background: #3D1F10; color: #fff; padding: 10px 18px; border: none; cursor: pointer; border-radius: 4px; }
        .btn.secondary { background: transparent; color: #3D1F10; border: 1px solid #3D1F10; margin-left: 8px; }
        .p-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 12px; }
        .p-card { border: 1px solid #ddd; padding: 10px; background: #fff; border-radius: 4px; }
        .p-card img { width: 100%; height: 160px; object-fit: cover; border-radius: 4px; }
        .featured-badge { display:inline-block; background:#9B1C1C; color:#fff; font-size:10px; padding:2px 8px; border-radius:10px; margin-left:6px; }
        .p-card-actions { margin-top: 8px; display:flex; gap:6px; }
        .p-card-actions button { flex:1; padding:6px; font-size:11px; border:1px solid #3D1F10; background:transparent; cursor:pointer; border-radius:4px; }
    </style>
</head>
<body>
<h2>THE INDIANI WAY - ADMIN PANEL</h2>
<p id="status" style="color:red">Checking key...</p>

<div class="card">
<h3 id="formTitle">Add Product</h3>
<form id="form">
    <input type="hidden" id="editId">
    <div class="grid">
        <input id="pName" placeholder="Product Name" required>
        <select id="category" required>
            <option value="">Category</option>
            <option>ethnic wear</option>
            <option>cord set</option>
            <option>shirt</option>
            <option>kurti</option>
            <option>pants</option>
            <option>frocks</option>
            <option>skirts</option>
            <option>jacket</option>
            <option>stoles</option>
        </select>
    </div>
    <div class="grid">
        <input id="price" type="number" placeholder="Original Price (eg 16400)" required>
        <input id="discountedPrice" type="number" placeholder="Discounted Price (eg 12900) - optional">
    </div>
    <textarea id="description" placeholder="Type Product Description" rows="3"></textarea>
    <p>Image Size  must be 300 x 300px in 250kb <p>
    <input type="file" id="image" accept="image/*">

    <div class="checkbox-row">
        <input type="checkbox" id="isFeatured">
        <label for="isFeatured">Show on homepage (featured) </label>
    </div>

    <button class="btn" type="submit">SAVE</button>
    <button class="btn secondary" type="button" id="cancel" style="display:none">Cancel Edit</button>
</form>
</div>

<div class="p-grid" id="list"></div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const KEY = urlParams.get('key');
const API = '/api/products';

if(!KEY){
    document.getElementById('status').innerText = "Key missing! Link Like: admin.html?key=YOUR_ADMIN_KEY";
} else {
    document.getElementById('status').innerText = "Access Granted: " + KEY;
    document.getElementById('status').style.color = 'green';
}

async function load(){
    const res = await fetch(API);
    const data = await res.json();
    const list = document.getElementById('list');
    list.innerHTML = '';
    data.forEach(p => {
        list.innerHTML += `
        <div class="p-card">
            <img src="${p.image}" onerror="this.src='https://via.placeholder.com/300'">
            <h4>${p.name} ${p.isFeatured ? '<span class="featured-badge">FEATURED</span>' : ''}</h4>
            <p>${p.category} | ₹${p.discountedPrice || p.price} ${p.discountedPrice ? `<s style='opacity:.6'>₹${p.price}</s>` : ''}</p>
            <p style='font-size:12px;opacity:.7'>${p.description || ''}</p>
            <div class="p-card-actions">
                <button onclick="editProd('${p._id}')">EDIT</button>
                <button onclick="delProd('${p._id}')">DELETE</button>
            </div>
        </div>`;
    });
}

document.getElementById('form').addEventListener('submit', async e => {
    e.preventDefault();
    const fd = new FormData();
    fd.append('name', pName.value);
    fd.append('category', category.value);
    fd.append('price', price.value);
    fd.append('discountedPrice', discountedPrice.value);
    fd.append('description', description.value);
    fd.append('isFeatured', isFeatured.checked);
    if(image.files[0]) fd.append('image', image.files[0]);

    const id = editId.value;
    const method = id ? 'PUT' : 'POST';
    const url = id ? `${API}/${id}?key=${KEY}` : `${API}?key=${KEY}`;

    await fetch(url, { method, headers: { 'x-admin-key': KEY }, body: fd });

    e.target.reset();
    editId.value = '';
    formTitle.innerText = 'Add Product';
    cancel.style.display = 'none';
    load();
});

window.editProd = async (id) => {
    const res = await fetch(API);
    const data = await res.json();
    const p = data.find(x => x._id === id);
    editId.value = p._id;
    pName.value = p.name;
    category.value = p.category;
    price.value = p.price;
    discountedPrice.value = p.discountedPrice || '';
    description.value = p.description || '';
    isFeatured.checked = !!p.isFeatured;
    formTitle.innerText = 'Edit: ' + p.name;
    cancel.style.display = 'inline';
    window.scrollTo(0, 0);
}

window.delProd = async (id) => {
    if(!confirm('Delete?')) return;
    await fetch(`${API}/${id}?key=${KEY}`, { method: 'DELETE', headers: { 'x-admin-key': KEY } });
    load();
}

document.getElementById('cancel').onclick = () => {
    form.reset();
    editId.value = '';
    formTitle.innerText = 'Add Product';
    cancel.style.display = 'none';
};

load();
</script>
</body>
</html>
