<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Your Cart - The Indiani Way</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
    --bg-main: #FDF6F0;
    --bg-card: #F9F0EA;
    --text-dark: #3D2116;
    --text-light: #8B6A5A;
    --white: #FFFBF7;
    --brown-dark: #3D1F10;
    --red-accent: #9B1C1C;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%; overflow-x:hidden;}
body{font-family:'Inter', sans-serif;background:var(--bg-main);color:var(--text-dark);}

.navbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 5%; background:var(--white);
    border-bottom:1px solid #EAE0D8;
    position:sticky; top:0; z-index:100;
    width:100%;
}
.logo{font-family:'Cormorant Garamond', serif;letter-spacing:3px;font-size:clamp(16px, 2vw, 19px);font-weight:500;cursor:pointer;}
.nav-links{display:flex;gap:24px;list-style:none;font-size:11px;letter-spacing:2px; align-items:center;}
.nav-links a{text-decoration:none;color:var(--text-dark);font-weight:500; position:relative; padding-bottom:3px;}
.nav-links a.active::after, .nav-links a:hover::after{content:''; position:absolute; left:0; bottom:0; width:100%; height:1.5px; background:var(--red-accent);}
.enquiry-count{ background:var(--red-accent); color:#fff; font-size:9px; padding:2px 6px; border-radius:10px; margin-left:4px; }

.page-header{padding:30px 5% 15px; width:100%;}
.main-heading{font-family:'Cormorant Garamond', serif; font-size: clamp(32px, 5vw, 52px); font-weight:400;}
.page-sub{font-size:11px; letter-spacing:2px; opacity:0.6; text-transform:uppercase; margin-top:6px;}

.cart-page{min-height:70vh; padding:10px 5% 60px;}

/* EMPTY STATE */
.empty-state{ padding: 80px 5%; text-align:center; }
.empty-state p{font-family:'Cormorant Garamond', serif; font-size: 22px; opacity:.7; margin-bottom:22px;}
.empty-state a.shop-btn{
    display:inline-block; padding:13px 30px; border:1px solid var(--text-dark);
    background:transparent; color:var(--text-dark); text-decoration:none;
    font-size:10px; letter-spacing:2px; text-transform:uppercase; transition:0.2s;
}
.empty-state a.shop-btn:hover{background:var(--text-dark); color:var(--white);}

/* CART ITEMS */
.cart-list{display:flex; flex-direction:column; gap:14px; max-width:820px;}
.cart-item{
    background:var(--white); border:1px solid #EAE0D8; padding:16px;
    display:flex; gap:18px; align-items:center; flex-wrap:wrap;
}
.cart-item img{width:80px; height:96px; object-fit:cover; background:var(--bg-card); flex-shrink:0;}
.item-info{flex:1; min-width:140px;}
.item-category{font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-light); margin-bottom:4px;}
.item-name{font-family:'Cormorant Garamond', serif; font-size:19px; margin-bottom:4px;}
.item-price{font-size:13px; font-weight:600;}
.item-price .strike{text-decoration:line-through; opacity:.5; font-weight:400; margin-left:6px; font-size:12px;}

.qty-controls{display:flex; align-items:center; gap:10px; border:1px solid #EAE0D8; padding:6px 10px;}
.qty-btn{width:22px; height:22px; border:1px solid var(--text-dark); background:transparent; cursor:pointer; font-size:13px; line-height:1;}
.qty-btn:hover{background:var(--text-dark); color:var(--white);}
.qty-val{font-size:13px; min-width:16px; text-align:center;}

.item-subtotal{font-family:'Cormorant Garamond', serif; font-size:18px; font-weight:600; min-width:80px; text-align:right;}

.remove-btn{background:none; border:none; font-size:16px; cursor:pointer; opacity:0.5; transition:0.2s; padding:4px;}
.remove-btn:hover{opacity:1; color:var(--red-accent);}

/* SUMMARY */
.cart-summary{
    max-width:820px; margin-top:20px; padding-top:18px;
    border-top:1px solid #EAE0D8;
    display:flex; justify-content:flex-end; gap:36px; flex-wrap:wrap;
}
.cart-summary div{text-align:right;}
.cart-summary .label{font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-light); margin-bottom:4px;}
.cart-summary .value{font-family:'Cormorant Garamond', serif; font-size:22px; font-weight:600;}

/* CHECKOUT FORM */
.checkout-section{max-width:460px; margin-top:44px;}
.checkout-section h3{font-family:'Cormorant Garamond', serif; font-size:24px; margin-bottom:16px;}
#checkoutForm{display:flex;flex-direction:column;gap:12px;background:#fff;padding:20px;border:1px solid #EAE0D8;}
#checkoutForm label{font-size:9px; letter-spacing:1.5px; text-transform:uppercase; color:var(--text-light); margin-bottom:-6px; display:block;}
#checkoutForm input, #checkoutForm textarea{width:100%; padding:12px 14px;border:1px solid #EAE0D8;font-family:'Inter';font-size:13px; background:var(--bg-main);}
#checkoutForm input:focus, #checkoutForm textarea:focus{outline:none; border-color:var(--text-dark);}
#checkoutForm textarea{resize:vertical; min-height:70px;}
.field-error{font-size:10px; color:var(--red-accent); display:none; margin-top:4px;}
.payment-row{
    border:1px solid #EAE0D8; padding:12px 14px; font-size:12px;
    display:flex; align-items:center; gap:8px; background:var(--bg-main); color:var(--text-light);
}
.payment-row strong{color:var(--text-dark);}
#placeOrderBtn{background:var(--brown-dark); color:#fff; padding:14px; border:none; font-size:11px; letter-spacing:1.5px; cursor:pointer; text-transform:uppercase; transition:0.2s;}
#placeOrderBtn:hover{background:var(--red-accent);}
#placeOrderBtn:disabled{opacity:0.6; cursor:not-allowed;}
.form-msg{font-size:12px; text-align:center; display:none; padding:10px;}
.form-msg.error{color:var(--red-accent); background:#FBEAEA;}
.form-msg.success{color:#137333; background:#E6F4EA;}

@media (max-width: 600px){
    .navbar{padding:14px 4%;}
    .page-header{padding:20px 4% 10px;}
    .cart-page{padding:10px 4% 50px;}
    .cart-item{padding:12px;}
    .item-subtotal{text-align:left; width:100%; order:5;}
}
</style>
</head>
<body>

<nav class="navbar">
    <div class="logo" onclick="window.location.href='product.html'" > <- Back</div>
    <ul class="nav-links">
        <li><a href="orders.html">Placed ORDERS</a></li>
        <li><a href="index.html">HOME</a></li>
    </ul>
</nav>

<div class="page-header">
    <h1 class="main-heading">Your Cart</h1>
    <p class="page-sub">Review & Checkout</p>
</div>

<div class="cart-page" id="cartPage">
    <div id="cartContent"></div>
</div>

<script>
const CART_KEY = 'indiani_cart';

function loadCart(){
    try{ return JSON.parse(localStorage.getItem(CART_KEY)) || []; }
    catch(e){ return []; }
}
function saveCart(cart){ localStorage.setItem(CART_KEY, JSON.stringify(cart)); }

function getItemPrice(item){
    return parseInt(item.discountedPrice || item.price);
}

function calculateTotal(cart){
    const totalItems = cart.reduce((s,i)=>s+i.qty,0);
    const totalAmount = cart.reduce((s,i)=>s + getItemPrice(i)*i.qty, 0);
    return { totalItems, totalAmount };
}

function updateCartBadge(){
    const cart = loadCart();
    const countEl = document.getElementById('cartCount');
    if(!countEl) return;
    const totalQty = cart.reduce((s,i)=>s+i.qty,0);
    if(totalQty > 0){ countEl.style.display='inline-block'; countEl.textContent=totalQty; }
    else { countEl.style.display='none'; }
}

function renderCart(){
    const cart = loadCart();
    const cartContent = document.getElementById('cartContent');

    if(cart.length === 0){
        cartContent.innerHTML = `
        <div class="empty-state">
            <p>Your cart is empty. Add some products</p>
            <a href="product.html" class="shop-btn">CONTINUE SHOPPING</a>
        </div>`;
        updateCartBadge();
        return;
    }

    const { totalItems, totalAmount } = calculateTotal(cart);

    let html = '<div class="cart-list">';
    cart.forEach((item, idx) => {
        const price = getItemPrice(item);
        const subtotal = price * item.qty;
        html += `
        <div class="cart-item">
            <img src="${item.image}" alt="${item.name}" onerror="this.src='https://via.placeholder.com/100'">
            <div class="item-info">
                <p class="item-category">${item.category || ''}</p>
                <h3 class="item-name">${item.name}</h3>
                <p class="item-price">₹${price}${item.discountedPrice ? `<span class="strike">₹${item.price}</span>` : ''}</p>
            </div>
            <div class="qty-controls">
                <button type="button" class="qty-btn" onclick="updateQty(${idx},-1)">−</button>
                <span class="qty-val">${item.qty}</span>
                <button type="button" class="qty-btn" onclick="updateQty(${idx},1)">+</button>
            </div>
            <div class="item-subtotal">₹${subtotal}</div>
            <button type="button" class="remove-btn" onclick="removeFromCart(${idx})">✕</button>
        </div>`;
    });
    html += '</div>';

    html += `
    <div class="cart-summary">
        <div><div class="label">Total Items</div><div class="value">${totalItems}</div></div>
        <div><div class="label">Total Amount</div><div class="value">₹${totalAmount}</div></div>
    </div>`;

    html += `
    <div class="checkout-section">
        <h3>Checkout Details</h3>
        <form id="checkoutForm" novalidate>
            <div>
                <label>Full Name</label>
                <input type="text" id="customerName" required>
                <div class="field-error" id="err-customerName">Please enter your full name.</div>
            </div>
            <div>
                <label>Phone Number</label>
                <input type="tel" id="customerPhone" maxlength="10" placeholder="10-digit mobile number" required>
                <div class="field-error" id="err-customerPhone">Enter a valid 10-digit phone number.</div>
            </div>
            <div>
                <label>Email Address</label>
                <input type="email" id="customerEmail" required>
                <div class="field-error" id="err-customerEmail">Enter a valid email address.</div>
            </div>
            <div>
                <label>Full Address</label>
                <textarea id="customerAddress" required></textarea>
                <div class="field-error" id="err-customerAddress">Please enter your delivery address.</div>
            </div>
            <div>
                <label>Pincode</label>
                <input type="text" id="pincode" maxlength="6" placeholder="6-digit pincode" required>
                <div class="field-error" id="err-pincode">Enter a valid 6-digit pincode.</div>
            </div>
            <div class="payment-row">
                <input type="radio" checked disabled> <strong>Cash on Delivery (COD)</strong>
            </div>
            <button type="submit" id="placeOrderBtn">PLACE ORDER</button>
            <div class="form-msg" id="formMsg"></div>
        </form>
    </div>`;

    cartContent.innerHTML = html;
    updateCartBadge();

    document.getElementById('checkoutForm').addEventListener('submit', handlePlaceOrder);
}

function updateQty(index, change){
    const cart = loadCart();
    if(!cart[index]) return;
    cart[index].qty += change;
    if(cart[index].qty < 1){ cart.splice(index,1); }
    saveCart(cart);
    renderCart();
}

function removeFromCart(index){
    const cart = loadCart();
    cart.splice(index,1);
    saveCart(cart);
    renderCart();
}

function showFieldError(id, show){
    const el = document.getElementById('err-'+id);
    if(el) el.style.display = show ? 'block' : 'none';
}

function validateForm(data){
    let valid = true;
    if(!data.customerName.trim()){ showFieldError('customerName', true); valid=false; } else showFieldError('customerName', false);
    if(!/^\d{10}$/.test(data.customerPhone.trim())){ showFieldError('customerPhone', true); valid=false; } else showFieldError('customerPhone', false);
    if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(data.customerEmail.trim())){ showFieldError('customerEmail', true); valid=false; } else showFieldError('customerEmail', false);
    if(!data.customerAddress.trim()){ showFieldError('customerAddress', true); valid=false; } else showFieldError('customerAddress', false);
    if(!/^\d{6}$/.test(data.pincode.trim())){ showFieldError('pincode', true); valid=false; } else showFieldError('pincode', false);
    return valid;
}

async function handlePlaceOrder(e){
    e.preventDefault();

    const formMsg = document.getElementById('formMsg');
    formMsg.style.display='none'; formMsg.className='form-msg';

    const data = {
        customerName: document.getElementById('customerName').value,
        customerPhone: document.getElementById('customerPhone').value,
        customerEmail: document.getElementById('customerEmail').value,
        customerAddress: document.getElementById('customerAddress').value,
        pincode: document.getElementById('pincode').value
    };

    if(!validateForm(data)){
        formMsg.textContent = 'Please fix the errors above.';
        formMsg.classList.add('error'); formMsg.style.display='block';
        return;
    }

    const cart = loadCart();
    if(cart.length === 0){
        formMsg.textContent = 'Your cart is empty.';
        formMsg.classList.add('error'); formMsg.style.display='block';
        return;
    }

    const { totalAmount } = calculateTotal(cart);
    const orderId = 'IND-' + Date.now();

    const payload = {
        orderId,
        customerName: data.customerName.trim(),
        customerPhone: data.customerPhone.trim(),
        customerEmail: data.customerEmail.trim(),
        customerAddress: data.customerAddress.trim(),
        pincode: data.pincode.trim(),
        products: cart,
        totalAmount
    };

    const btn = document.getElementById('placeOrderBtn');
    btn.disabled = true; btn.textContent = 'PLACING ORDER...';

    try{
        const res = await fetch('/api/orders', {
            method:'POST',
            headers:{'Content-Type':'application/json'},
            body: JSON.stringify(payload)
        });
        if(!res.ok) throw new Error('Order failed');

        localStorage.removeItem(CART_KEY);
        window.location.href = 'orders.html?orderId=' + encodeURIComponent(orderId);

    }catch(err){
        formMsg.textContent = 'Something went wrong placing your order. Please try again.';
        formMsg.classList.add('error'); formMsg.style.display='block';
        btn.disabled = false; btn.textContent = 'PLACE ORDER';
    }
}

document.addEventListener('DOMContentLoaded', () => {
    renderCart();
});
</script>
</body>
</html>
