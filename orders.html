<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Your Orders - The Indiani Way</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
    --bg-main: #FDF6F0;
    --bg-card: #F9F0EA;
    --text-dark: #3D2116;
    --text-light: #8B6A5A;
    --white: #FFFBF7;
    --brown-dark: #3D1F10;
    --red-accent: #9B1C1C;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%; overflow-x:hidden;}
body{font-family:'Inter', sans-serif;background:var(--bg-main);color:var(--text-dark);}

.navbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 5%; background:var(--white);
    border-bottom:1px solid #EAE0D8;
    position:sticky; top:0; z-index:100;
    width:100%;
}
.logo{font-family:'Cormorant Garamond', serif;letter-spacing:3px;font-size:clamp(16px, 2vw, 19px);font-weight:500;cursor:pointer;}
.nav-links{display:flex;gap:24px;list-style:none;font-size:11px;letter-spacing:2px; align-items:center;}
.nav-links a{text-decoration:none;color:var(--text-dark);font-weight:500; position:relative; padding-bottom:3px;}
.nav-links a.active::after, .nav-links a:hover::after{content:''; position:absolute; left:0; bottom:0; width:100%; height:1.5px; background:var(--red-accent);}
.enquiry-count{ background:var(--red-accent); color:#fff; font-size:9px; padding:2px 6px; border-radius:10px; margin-left:4px; }

.page-header{padding:30px 5% 15px; width:100%;}
.main-heading{font-family:'Cormorant Garamond', serif; font-size: clamp(32px, 5vw, 52px); font-weight:400;}
.page-sub{font-size:11px; letter-spacing:2px; opacity:0.6; text-transform:uppercase; margin-top:6px;}

.orders-page{min-height:70vh; padding:10px 5% 60px;}

/* EMPTY STATE */
.empty-state{ padding: 80px 5%; text-align:center; }
.empty-state p{font-family:'Cormorant Garamond', serif; font-size: 22px; opacity:.7; margin-bottom:22px;}
.empty-state a.shop-btn{
    display:inline-block; padding:13px 30px; border:1px solid var(--text-dark);
    background:transparent; color:var(--text-dark); text-decoration:none;
    font-size:10px; letter-spacing:2px; text-transform:uppercase; transition:0.2s;
}
.empty-state a.shop-btn:hover{background:var(--text-dark); color:var(--white);}

/* ORDER SUCCESS BANNER (shown when redirected with orderId) */
.order-success{
    max-width:600px; background:var(--white); border:1px solid #EAE0D8;
    padding:30px; text-align:center; margin-bottom:30px;
}
.order-success .success-icon{width:50px; height:50px; border-radius:50%; background:#E6F4EA; color:#137333; display:grid; place-items:center; font-size:20px; margin:0 auto 14px;}
.order-success h3{font-family:'Cormorant Garamond', serif; font-size:22px; margin-bottom:6px;}
.order-success p{font-size:13px; opacity:0.75;}
.order-success .order-id{font-weight:600; color:var(--red-accent);}

/* ORDER LIST */
.order-list{display:flex; flex-direction:column; gap:14px; max-width:820px;}
.order-item{background:var(--white); border:1px solid #EAE0D8; padding:16px;}
.order-item-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px; flex-wrap:wrap; gap:8px;}
.order-id-label{font-size:12px; font-weight:600;}
.order-date{font-size:11px; opacity:0.6;}
.order-products img{width:60px; height:72px; object-fit:cover; background:var(--bg-card);}

@media (max-width: 600px){
    .navbar{padding:14px 4%;}
    .page-header{padding:20px 4% 10px;}
    .orders-page{padding:10px 4% 50px;}
}
</style>
</head>
<body>

<nav class="navbar">
    <div class="logo" onclick="window.location.href='product.html'" title="Go to Home"> <- Back</div>
    <ul class="nav-links">
        <li><a href="index.html">HOME</a></li>
    </ul>
</nav>

<div class="page-header">
    <h1 class="main-heading">Your Orders</h1>
    <p class="page-sub">Track Your Purchases</p>
</div>

<div class="orders-page" id="ordersPage">
    <div id="ordersContent"></div>
</div>

<script>
function updateCartBadge(){
    const cart = JSON.parse(localStorage.getItem('indiani_cart') || '[]');
    const countEl = document.getElementById('cartCount');
    const totalQty = cart.reduce((s,i)=>s+i.qty,0);
    if(totalQty > 0){ countEl.style.display='inline-block'; countEl.textContent=totalQty; }
    else { countEl.style.display='none'; }
}
function updateEnquiryBadge(){
    const enquiries = JSON.parse(localStorage.getItem('indiani_enquiries') || '[]');
    const countEl = document.getElementById('enquiryCount');
    if(enquiries.length > 0){ countEl.style.display='inline-block'; countEl.textContent=enquiries.length; }
    else { countEl.style.display='none'; }
}

function renderOrders(){
    const ordersContent = document.getElementById('ordersContent');
    const params = new URLSearchParams(window.location.search);
    const orderId = params.get('orderId');

    let html = '';

    // If just redirected here after placing an order, show a success banner
    if(orderId){
        html += `
        <div class="order-success">
            <div class="success-icon">✓</div>
            <h3>Order Placed Successfully!</h3>
            <p>Your Order ID is <span class="order-id">${orderId}</span>. We will reach out to you shortly.</p>
        </div>`;
    }

    // No order history system is wired up yet (no GET /api/orders by user),
    // so unless we just placed one, show the empty state.
    if(!orderId){
        html += `
        <div class="empty-state">
            <p>No orders placed yet</p>
            <a href="product.html" class="shop-btn">START SHOPPING</a>
        </div>`;
    }

    ordersContent.innerHTML = html;
}

document.addEventListener('DOMContentLoaded', () => {
    renderOrders();
    updateCartBadge();
    updateEnquiryBadge();
});
</script>
</body>
</html>
