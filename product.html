<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>The Indiani Way - Products</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
    --bg-main: #FDF6F0;
    --bg-card: #F9F0EA;
    --text-dark: #3D2116;
    --text-light: #8B6A5A;
    --white: #FFFBF7;
    --brown-dark: #3D1F10;
    --red-accent: #9B1C1C;
}
*{margin:0;padding:0;box-sizing:border-box;}
html,body{width:100%; overflow-x:hidden;}
body{font-family:'Inter', sans-serif;background:var(--bg-main);color:var(--text-dark);}

.navbar{
    display:flex; justify-content:space-between; align-items:center;
    padding:18px 5%; background:var(--white);
    border-bottom:1px solid #EAE0D8;
    position:sticky; top:0; z-index:100;
    width:100%;
}
.logo{font-family:'Cormorant Garamond', serif;letter-spacing:3px;font-size:clamp(16px, 2vw, 19px);font-weight:500;cursor:pointer;}
.nav-links{display:flex;gap:24px;list-style:none;font-size:11px;letter-spacing:2px; align-items:center;}
.nav-links a{text-decoration:none;color:var(--text-dark);font-weight:500; position:relative; padding-bottom:3px;}
.nav-links a.active::after, .nav-links a:hover::after{content:''; position:absolute; left:0; bottom:0; width:100%; height:1.5px; background:var(--red-accent);}
.enquiry-count{ background:var(--red-accent); color:#fff; font-size:9px; padding:2px 6px; border-radius:10px; margin-left:4px; }

.featured-header{padding:30px 5% 15px; width:100%; display:flex; justify-content:space-between; align-items:end;}
.main-heading{font-family:'Cormorant Garamond', serif; font-size: clamp(32px, 5vw, 52px); font-weight:400;}
.categories{font-size:11px; letter-spacing:2px; opacity:0.6; text-transform:uppercase;}

.filter-section{
    padding:12px 5%; display:flex; gap:8px;
    border-bottom:1px solid #EAE0D8; border-top:1px solid #EAE0D8;
    background:var(--bg-main); position:sticky; top:58px; z-index:90;
    overflow-x:auto; white-space:nowrap; scrollbar-width:none;
    width:100%;
}
.filter-section::-webkit-scrollbar{display:none;}
.filter-btn{
    flex-shrink:0; padding:7px 16px; border:1px solid var(--text-dark);
    background:transparent; font-size:10px; letter-spacing:1.5px;
    text-transform:uppercase; cursor:pointer; transition:0.2s;
}
.filter-btn.active, .filter-btn:hover{background:var(--text-dark);color:var(--white);}

.product-grid{
    display:grid;
    width:100%;
    padding:20px 5%;
    gap:clamp(10px, 2vw, 20px);
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
}
.product-empty{ padding: 60px 5%; text-align:center; font-family:'Cormorant Garamond', serif; font-size: 20px; opacity: .6; }

.product-card{background:var(--white);border:1px solid #EAE0D8; width:100%; transition:0.3s;}
.product-card:hover{transform:translateY(-5px); box-shadow:0 10px 30px rgba(61,31,16,0.08);}
.image-wrap{background:var(--bg-card);position:relative;aspect-ratio:1/1.15;overflow:hidden;width:100%;}
.image-wrap img{width:100%;height:100%;object-fit:cover;display:block;}
.wishlist-btn{
    position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;
    background:#fff;border:none;display:grid;place-items:center;cursor:pointer;font-size:16px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1); transition:0.2s; z-index:2;
}
.wishlist-btn.wished{background:var(--red-accent); color:#fff;}
.product-info{padding:12px 10px;}
.product-category{font-size:8px;letter-spacing:1.5px;text-transform:uppercase;color:var(--text-light);margin-bottom:4px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.product-name{font-family:'Cormorant Garamond', serif;font-size:clamp(14px, 2.5vw, 17px);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.product-desc{ font-size:11px; color:var(--text-light); line-height:1.4; margin-bottom:8px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
.product-price{font-size:12px;font-weight:600;margin-bottom:10px;}
.product-price .strike{ text-decoration:line-through; opacity:.5; font-weight:400; margin-left:4px; }
.cart-btn{width:100%;padding:8px;border:1px solid var(--text-dark);background:var(--text-dark);color:#fff;font-size:9px;letter-spacing:1.2px;cursor:pointer; transition:0.2s;}
.cart-btn:hover{background:transparent;color:var(--text-dark);}

@media (max-width: 600px){
    .product-grid{grid-template-columns: repeat(2, 1fr); padding:12px 3%; gap:10px;}
    .navbar{padding:14px 4%;}
    .featured-header{padding:20px 4% 10px;}
    .filter-section{padding:10px 4%; top:50px;}
}
@media (min-width: 601px) and (max-width: 900px){
    .product-grid{grid-template-columns: repeat(3, 1fr); padding:18px 4%;}
}
@media (min-width: 901px) and (max-width: 1300px){
    .product-grid{grid-template-columns: repeat(4, 1fr);}
}
@media (min-width: 1301px){
    .product-grid{grid-template-columns: repeat(5, 1fr); padding:25px 5%;}
}
</style>
</head>
<body>

<nav class="navbar">
    <div class="logo" onclick="window.location.href='index.html'" title="Go to Home">THE INDIANI WAY</div>
    <ul class="nav-links">
        <li><a href="index.html">HOME</a></li>
        <li><a href="product.html" class="active">PRODUCTS</a></li>
        <li><a href="cart.html" id="cart">CART <span id="cartCount" class="enquiry-count" style="display:none">0</span></a></li>
        <li><a href="orders.html" id="yourOrdersLink">PLACED ORDERS</a></li>
    </ul>
</nav>

<div id="mainShop">
    <div class="featured-header">
        <div>
            <h1 class="main-heading">Our Products</h1>
            <p class="categories">Categories • Handcrafted in India</p>
        </div>
    </div>

    <div class="filter-section">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="ethnic wear">Ethnic Wear</button>
        <button class="filter-btn" data-filter="cord set">Cord Set</button>
        <button class="filter-btn" data-filter="shirt">Shirt</button>
        <button class="filter-btn" data-filter="kurti">Kurti</button>
        <button class="filter-btn" data-filter="pants">Pants</button>
        <button class="filter-btn" data-filter="frocks">Frocks</button>
        <button class="filter-btn" data-filter="skirts">Skirts</button>
        <button class="filter-btn" data-filter="jacket">Jacket</button>
        <button class="filter-btn" data-filter="stoles">Stoles</button>
    </div>

    <div class="product-grid" id="productGrid"></div>
</div>

<script>
/* Sab products backend (MongoDB + Cloudinary) se aate hain — admin panel se
   jo add/edit karoge, wahi yahan dikhega. Kuch hardcode nahi hai. */

let products = [];
let wishlist = JSON.parse(localStorage.getItem('indiani_wishlist') || '[]');
let cart = JSON.parse(localStorage.getItem('indiani_cart') || '[]');

const grid = document.getElementById('productGrid');

async function loadAllProducts(){
    try{
        const res = await fetch('/api/products');
        const data = await res.json();
        products = data.map(p => ({
            id: p._id,
            category: p.category,
            name: p.name,
            price: p.price,
            discountedPrice: p.discountedPrice,
            description: p.description,
            image: p.image
        }));
        renderProducts(products);
    }catch(err){
        grid.innerHTML = '<p class="product-empty">Products load Issue, Try After Some time.</p>';
        console.error('Failed to load products:', err);
    }
}

function renderProducts(list){
    if(!list.length){
        grid.innerHTML = '<p class="product-empty">No Product Found.</p>';
        return;
    }
    grid.innerHTML = "";
    list.forEach(p => {
        const isWished = wishlist.includes(p.id);
        const displayPrice = p.discountedPrice ? p.discountedPrice : p.price;
        grid.innerHTML += `
        <div class="product-card">
            <div class="image-wrap">
                <img src="${p.image}" alt="${p.name}" onerror="this.src='https://via.placeholder.com/300x400?text=${encodeURIComponent(p.name)}'">
                <button class="wishlist-btn ${isWished ? 'wished' : ''}" data-id="${p.id}" aria-label="Add to wishlist">${isWished ? '♥' : '♡'}</button>
            </div>
            <div class="product-info">
                <p class="product-category">${p.category}</p>
                <h3 class="product-name">${p.name}</h3>
                ${p.description ? `<p class="product-desc">${p.description}</p>` : ''}
                <p class="product-price">INR ₹${displayPrice}${p.discountedPrice ? `<span class="strike">₹${p.price}</span>` : ''}</p>
                <button class="cart-btn" data-id="${p.id}">ADD TO CART</button>
            </div>
        </div>`;
    });
    attachCardEvents();
}

function attachCardEvents(){
    document.querySelectorAll('.wishlist-btn').forEach(btn => {
        btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const id = btn.getAttribute('data-id');
            const isWished = btn.classList.toggle('wished');
            if(isWished){ wishlist.push(id); btn.textContent = '♥'; }
            else { wishlist = wishlist.filter(i => i !== id); btn.textContent = '♡'; }
            localStorage.setItem('indiani_wishlist', JSON.stringify(wishlist));
        });
    });

    document.querySelectorAll('.cart-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            const id = btn.getAttribute('data-id');
            const prod = products.find(pr => pr.id === id);
            const existing = cart.find(c => c.id === id);
            if(existing){ existing.qty += 1; }
            else { cart.push({...prod, qty: 1}); }
            localStorage.setItem('indiani_cart', JSON.stringify(cart));
            updateCartCount();
            alert('Added to cart');
        });
    });
}

function updateCartCount(){
    const countEl = document.getElementById('cartCount');
    if(!countEl) return;
    const totalQty = cart.reduce((s,i)=>s+i.qty,0);
    if(totalQty > 0){ countEl.style.display='inline-block'; countEl.textContent=totalQty; }
    else { countEl.style.display='none'; }
}

document.querySelectorAll('.filter-btn').forEach(btn=>{
    btn.addEventListener('click', function(){
        document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
        this.classList.add('active');
        const f = this.getAttribute('data-filter');
        if(f==='all') renderProducts(products); else renderProducts(products.filter(p=>p.category===f));
    });
});

loadAllProducts();
updateCartCount();
</script>
</body>
</html>
